<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to WebP/AVIF Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        .drop-zone {
            border: 3px dashed #cbd5e0;
            transition: all 0.3s ease;
        }
        .drop-zone.dragover {
            border-color: #4299e1;
            background-color: #ebf8ff;
        }
        .image-preview {
            max-width: 200px;
            max-height: 200px;
            object-fit: contain;
        }
        .quality-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #4299e1;
            cursor: pointer;
            border-radius: 50%;
        }
        .quality-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #4299e1;
            cursor: pointer;
            border-radius: 50%;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-800 mb-2">
                🖼️ Image to WebP/AVIF Converter
            </h1>
            <p class="text-gray-600">PNG, JPEG, TIFF などの画像を WebP や AVIF に変換</p>
        </div>

        <!-- Main Card -->
        <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
            <!-- Drop Zone -->
            <div id="dropZone" class="drop-zone rounded-xl p-12 text-center mb-6 cursor-pointer">
                <svg class="mx-auto h-16 w-16 text-gray-400 mb-4" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <p class="text-xl text-gray-700 mb-2">画像をドラッグ&ドロップ</p>
                <p class="text-gray-500 mb-4">または</p>
                <button id="selectFilesBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 px-8 rounded-lg transition duration-200 shadow-md">
                    📁 ファイルを選択
                </button>
                <input type="file" id="fileInput" accept="image/*" multiple class="hidden">
            </div>

            <!-- Conversion Options -->
            <div class="grid md:grid-cols-3 gap-6 mb-6">
                <!-- Output Format -->
                <div class="bg-gray-50 p-4 rounded-lg">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">出力形式</label>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="format" value="webp" checked class="w-4 h-4 text-blue-600">
                            <span class="ml-2 text-gray-700">WebP</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="format" value="avif" class="w-4 h-4 text-blue-600">
                            <span class="ml-2 text-gray-700">AVIF</span>
                        </label>
                    </div>
                </div>

                <!-- WebP Mode -->
                <div id="webpModeSection" class="bg-gray-50 p-4 rounded-lg">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">WebP 圧縮モード</label>
                    <div class="space-y-2">
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="webpMode" value="lossy" checked class="w-4 h-4 text-blue-600">
                            <span class="ml-2 text-gray-700">不可逆 (Lossy)</span>
                        </label>
                        <label class="flex items-center cursor-pointer">
                            <input type="radio" name="webpMode" value="lossless" class="w-4 h-4 text-blue-600">
                            <span class="ml-2 text-gray-700">可逆 (Lossless)</span>
                        </label>
                    </div>
                </div>

                <!-- Quality Slider -->
                <div id="qualitySection" class="bg-gray-50 p-4 rounded-lg">
                    <label class="block text-sm font-semibold text-gray-700 mb-3">
                        品質: <span id="qualityValue" class="text-blue-600">80</span>%
                    </label>
                    <input type="range" id="qualitySlider" min="1" max="100" value="80"
                           class="quality-slider w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                    <div class="flex justify-between text-xs text-gray-500 mt-1">
                        <span>低</span>
                        <span>高</span>
                    </div>
                </div>
            </div>

            <!-- Convert Button -->
            <button id="convertBtn" class="w-full bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 text-white font-bold py-4 px-6 rounded-lg transition duration-200 shadow-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                🔄 変換を開始
            </button>
        </div>

        <!-- Results Section -->
        <div id="resultsSection" class="hidden">
            <div class="bg-white rounded-2xl shadow-xl p-8 mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">変換結果</h2>

                <div id="resultsContainer" class="space-y-4">
                    <!-- Results will be inserted here -->
                </div>

                <!-- Download All Button -->
                <button id="downloadAllBtn" class="w-full mt-6 bg-gradient-to-r from-green-500 to-teal-600 hover:from-green-600 hover:to-teal-700 text-white font-bold py-4 px-6 rounded-lg transition duration-200 shadow-lg">
                    📦 すべてを ZIP でダウンロード
                </button>
            </div>
        </div>

        <!-- Progress Indicator -->
        <div id="progressSection" class="hidden bg-white rounded-2xl shadow-xl p-8">
            <div class="flex items-center justify-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mr-4"></div>
                <span class="text-xl text-gray-700">変換中...</span>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
